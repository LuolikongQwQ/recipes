name        : android-tools
version     : "37.0.0p1"
release     : 10
homepage    : https://developer.android.com/tools
upstreams   :
    - https://github.com/nmeum/android-tools/releases/download/37.0.0p1/android-tools-37.0.0p1.tar.xz : 2c6de1abe16b211c7d9f59276217e14fd9e0e18b20e331d3c84358f5dffd576e
summary     : Android SDK Platform-Tools
description : |
    Android SDK Platform-Tools is a component for the Android SDK.
    It includes tools that interface with the Android platform, primarily adb and fastboot.
license     :
    - Apache-2.0
builddeps   :
    - pkgconfig(fmt)
    - pkgconfig(libbrotlicommon)
    - pkgconfig(liblz4)
    - pkgconfig(libpcre2-8)
    - pkgconfig(libusb-1.0)
    - pkgconfig(libzstd)
    - pkgconfig(protobuf)
    - pkgconfig(zlib)
    - protobuf-staticlib
setup       : |
    %patch %(pkgdir)/0001-ftbfs-protobuf-36.0.patch

    %cmake
build       : |
    %cmake_build
install     : |
    %cmake_install
